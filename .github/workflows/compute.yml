name: compute-pool
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "python code to run"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: execute queued jobs
        env:
          DISPATCH_TASK: ${{ github.event.inputs.task }}
        run: |
          python runner.py
      - name: commit results
        run: |
          git config user.name "compute-pool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/ || true
          git diff --cached --quiet || git commit -m "results: $(date -u +%FT%TZ)"
          git push
